<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="eggGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#27272a" stroke-width="8"/>
  <g transform="translate(256, 270)">
    <!-- Stylized egg shape -->
    <path d="M 0,-150 C 90,-150 145,-50 145,50 C 145,130 80,170 0,170 C -80,170 -145,130 -145,50 C -145,-50 -90,-150 0,-150 Z" 
          fill="url(#eggGrad)" 
          stroke="#a7f3d0" 
          stroke-width="6"/>
    <!-- Farm leaf detail -->
    <path d="M -30,50 C -30,-40 50,-80 50,-80 C 50,-80 70,0 20,40 C -10,65 -25,55 -30,50 Z" 
          fill="#ecfdf5" 
          opacity="0.95"/>
    <path d="M 50,-80 C 20,-20 0,25 -25,48" 
          fill="none" 
          stroke="#059669" 
          stroke-width="5" 
          stroke-linecap="round"/>
  </g>
</svg>
